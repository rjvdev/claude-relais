[package]
name = "cosmic-applet-claude"
version = "1.0.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
env_logger = "0.11"
log = "0.4"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = ["applet", "applet-token"]

[profile.release]
lto = "thin"
